# Deploys the GPU pose-analysis gRPC service (badminton_analysis_ai/) to
# Cloud Run in asia-southeast1 on an NVIDIA L4: builds the image, releases a
# no-traffic candidate revision, verifies it with a live video analysis run,
# promotes it to 100% traffic, then prunes superseded revisions and images.
#
# Only the LINE bot backend can invoke it: the service is deployed without
# public access and its IAM policy names that one service account as the sole
# run.invoker, so an unauthenticated caller never reaches a container.
#
# The service scales to zero (--min 0): an L4 is billed by the second, and
# analyses arrive in bursts around class, so keeping an instance warm all week
# costs far more than it saves. The trade is a cold start on the first request
# after an idle period, which loads the TensorRT pose engines and the diffusion
# prior; the Go client's per-analysis deadline already covers that.
name: Motion Analysis Service CD

on:
  push:
    branches: [main]
    paths:
      # Only what actually goes into the GPU image. The Go client under
      # linebot/api/analysis is a consumer of this service, not part of it --
      # editing it used to trigger a full image rebuild and GPU redeploy that
      # could not change what was deployed. proto stays, because the Python
      # stubs baked into the image are generated from it.
      - 'badminton_analysis_ai/**'
      - 'proto/**'
      - '.github/workflows/cd-motion-analysis.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nstc-linebot-2025
    env:
      GCS_BUCKET_NAME: nstc-2025-storage
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: linebot/go.mod
          cache-dependency-path: linebot/go.sum

      - name: Download and verify the RF-DETR TensorRT engine
        run: |
          # Built once on an L4 by build_rfdetr_engine.py and kept in GCS. The
          # engine is tied to that GPU, and the detector looks it up by GPU
          # name, so it is baked in at exactly the path it expects rather than
          # rebuilt per cold start on a service that scales to zero.
          mkdir -p badminton_analysis_ai/models/trt-engines
          gcloud storage rsync --recursive \
            gs://${{ env.GCS_BUCKET_NAME }}/models/rfdetr-trt-engines \
            badminton_analysis_ai/models/trt-engines
          cd badminton_analysis_ai/models/trt-engines
          sha256sum --check ../trt-engines.sha256

      - name: Build GPU analysis image
        working-directory: badminton_analysis_ai
        run: |
          # `gcloud builds submit` waits by polling the build once a second. Both
          # CD workflows run on a push to main, so two waits share the project's
          # 60-get-requests-per-minute quota; once they exceed it the wait dies on a
          # 429 while the build carries on and succeeds unnoticed, leaving the job
          # hanging until its own timeout. Submit asynchronously and poll slowly, so
          # a rejected poll costs one interval rather than the whole deploy.
          build_id="$(gcloud builds submit --async \
              --timeout=3600s \
              --machine-type=e2-highcpu-8 \
              --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/badminton-analysis:${{ github.sha }} \
              --format='value(id)')"
          test -n "${build_id}" || { echo "build was not submitted" >&2; exit 1; }
          echo "build ${build_id} submitted"
          reported=""
          for _ in $(seq 1 180); do
            sleep 20
            # A describe that fails is a lost poll, not a failed build: keep waiting.
            status="$(gcloud builds describe "${build_id}" --format='value(status)' 2>/dev/null)" || continue
            if [ "${status}" != "${reported}" ]; then
              echo "  ${status}"
              reported="${status}"
            fi
            case "${status}" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds log "${build_id}" 2>/dev/null | tail -60
                echo "build ${build_id} ended ${status}" >&2
                exit 1 ;;
            esac
          done
          echo "build ${build_id} still running after 60 minutes" >&2
          exit 1

      - name: Deploy gRPC analysis service
        run: |
          candidate_tag="candidate-${GITHUB_RUN_ID}"
          # A release verification must never bootstrap a missing service:
          # that would make an unverified first revision live. Provisioning is
          # a separate, explicit operation; CD only creates no-traffic
          # candidates behind an already-serving revision.
          gcloud run services describe badminton-analysis-ai \
            --region asia-southeast1 >/dev/null 2>&1 || {
              echo "badminton-analysis-ai is absent; refusing an unverified bootstrap" >&2
              exit 1
            }
          candidate_args=(--no-traffic --tag "${candidate_tag}")
          gcloud run deploy badminton-analysis-ai \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/badminton-analysis:${{ github.sha }} \
            --platform managed \
            --region asia-southeast1 \
            --no-allow-unauthenticated \
            --use-http2 \
            --service-account ${{ secrets.GCP_SA_EMAIL }} \
            --execution-environment gen2 \
            --gpu-type nvidia-l4 \
            --cpu 4 \
            --memory 16Gi \
            --concurrency 1 \
            --timeout 3600 \
            --min 0 \
            --max-instances 1 \
            "${candidate_args[@]}" \
            --clear-volume-mounts \
            --clear-volumes \
            --set-env-vars GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCS_BUCKET_NAME=${{ env.GCS_BUCKET_NAME }},GCP_SERVICE_ACCOUNT_EMAIL=${{ secrets.GCP_SA_EMAIL }},EXPERT_MOTION_DEVICE=auto,BADMINTON_TRT_CACHE_DIR=/app/models/trt-engines,OPENAI_COACHING_MODEL=gpt-5.6-terra,COACHING_PAUSE_SECONDS=2,COACHING_NO_SUGGESTION_MIN_SCORE=90,COACHING_NO_SUGGESTION_MIN_CRITERION_RATIO=0.8,SIGNED_URL_MINUTES=60 \
            --set-secrets ANALYSIS_GRPC_API_KEY=analysis-grpc-api-key:latest,OPENAI_API_KEY=openai-api-key:latest
          candidate_revision="$(gcloud run services describe badminton-analysis-ai \
            --region asia-southeast1 --format='value(status.latestCreatedRevisionName)')"
          candidate_url="$(gcloud run services describe badminton-analysis-ai \
            --region asia-southeast1 --format=json | jq -r \
            --arg tag "${candidate_tag}" '.status.traffic[] | select(.tag == $tag) | .url')"
          test -n "${candidate_revision}"
          test -n "${candidate_url}"
          echo "ANALYSIS_CANDIDATE_TAG=${candidate_tag}" >> "${GITHUB_ENV}"
          echo "ANALYSIS_CANDIDATE_REVISION=${candidate_revision}" >> "${GITHUB_ENV}"
          echo "ANALYSIS_CANDIDATE_URL=${candidate_url}" >> "${GITHUB_ENV}"
          # The service's own URL, which is what an identity token has to name
          # as its audience even when the request goes to a candidate tag.
          service_url="$(gcloud run services describe badminton-analysis-ai \
            --region asia-southeast1 --format='value(status.url)')"
          test -n "${service_url}"
          echo "ANALYSIS_SERVICE_URL=${service_url}" >> "${GITHUB_ENV}"

      - name: Restrict analysis service to the bot backend
        run: |
          # The GPU service is billed by the second and sits on a public URL, so
          # only the LINE bot backend may invoke it. Both run as this service
          # account; anything else Cloud Run rejects before a container starts.
          # Deploying with --no-allow-unauthenticated already drops allUsers;
          # this adds the one principal that is allowed back in.
          gcloud run services add-iam-policy-binding badminton-analysis-ai \
            --region asia-southeast1 \
            --member "serviceAccount:${{ secrets.GCP_SA_EMAIL }}" \
            --role roles/run.invoker \
            --quiet
          echo "invokers now:"
          gcloud run services get-iam-policy badminton-analysis-ai \
            --region asia-southeast1 --format=json | jq -r \
            '.bindings[]? | select(.role == "roles/run.invoker") | .members[]'

      - name: Run real gRPC video analysis
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          mkdir -p /tmp/analysis-e2e
          gcloud storage cp \
            'gs://${{ env.GCS_BUCKET_NAME }}/experts/v3/smash/videos/戚佑仁7.mp4' \
            /tmp/analysis-e2e/smash-expert.mp4
          gcloud storage cp \
            gs://${{ env.GCS_BUCKET_NAME }}/experts/v3/serve/videos/expert-4-1_left.mov \
            /tmp/analysis-e2e/serve-expert-left.mov
          export ANALYSIS_GRPC_TARGET="${ANALYSIS_CANDIDATE_URL#https://}"
          export ANALYSIS_GRPC_API_KEY="$(gcloud secrets versions access latest \
            --secret analysis-grpc-api-key)"
          # The service now requires an invoker identity. This runner is
          # authenticated by workload identity federation, which cannot mint an
          # audience-bound token from ambient credentials, so impersonate the
          # service account the bot backend runs as and hand the token over.
          # Audienced to the service URL, not the candidate tag URL that the
          # request actually goes to. Cloud Run validates an identity token
          # against the service, so a token minted for a tag URL is refused with
          # a bare 401 -- which is why this passed while the service was being
          # bootstrapped, when the two URLs were the same, and failed as soon as
          # a candidate revision got its own tag.
          export RUN_LIVE_ANALYSIS=1
          cd linebot
          refresh_identity_token() {
            # A cold L4 plus two 30-minute analyses can outlive one token. Mint
            # a fresh token for every attempt and keep its audience bound to
            # the stable service URL even though requests use the candidate
            # tag host.
            export ANALYSIS_IDENTITY_TOKEN="$(gcloud auth print-identity-token \
              --impersonate-service-account "${{ secrets.GCP_SA_EMAIL }}" \
              --audiences "${ANALYSIS_SERVICE_URL}")"
            test -n "${ANALYSIS_IDENTITY_TOKEN}"
            claims="$(echo "${ANALYSIS_IDENTITY_TOKEN}" | cut -d. -f2)"
            while [ $(( ${#claims} % 4 )) -ne 0 ]; do claims="${claims}="; done
            payload="$(echo "${claims}" | tr '_-' '/+' | base64 -d 2>/dev/null)"
            token_aud="$(echo "${payload}" | jq -r '.aud // empty')"
            if [ "${token_aud}" != "${ANALYSIS_SERVICE_URL}" ]; then
              echo "identity token audience ${token_aud} is not ${ANALYSIS_SERVICE_URL}" >&2
              return 1
            fi
          }
          run_fixture() {
            export LIVE_ANALYSIS_VIDEO="$1"
            export LIVE_ANALYSIS_SKILL="$2"
            export LIVE_ANALYSIS_HANDEDNESS="$3"
            export LIVE_ANALYSIS_MIN_GRADE="${4:-}"
            export LIVE_ANALYSIS_EXPERT_PREFIX="${5:-}"
            export LIVE_ANALYSIS_EXPECT_NO_CUES="${6:-}"
            export LIVE_ANALYSIS_EXPECT_EXPERT_VIDEO="${7:-}"
            for attempt in 1 2 3; do
              refresh_identity_token
              if go test -timeout 40m -count=1 -v ./api/analysis \
                -run '^TestLiveAnalysisService$'; then
                return 0
              fi
              if [[ "$attempt" != "3" ]]; then
                echo "GPU service was not ready; retrying after the current request drains"
                sleep 180
              fi
            done
            return 1
          }
          run_wrong_skill_fixture() {
            export LIVE_ANALYSIS_VIDEO="$1"
            export LIVE_ANALYSIS_SKILL="$2"
            export LIVE_ANALYSIS_HANDEDNESS="$3"
            export RUN_LIVE_ANALYSIS_SKILL_MISMATCH=1
            for attempt in 1 2 3; do
              refresh_identity_token
              if go test -timeout 40m -count=1 -v ./api/analysis \
                -run '^TestLiveAnalysisRejectsSkillMismatch$'; then
                unset RUN_LIVE_ANALYSIS_SKILL_MISMATCH
                return 0
              fi
              if [[ "$attempt" != "3" ]]; then
                echo "GPU service was not ready; retrying after the current request drains"
                sleep 180
              fi
            done
            unset RUN_LIVE_ANALYSIS_SKILL_MISMATCH
            return 1
          }
          # The smash fixture is 戚佑仁7 rather than 張宸愷6 because the endpoint
          # detector is not stable on that clip: its wrist-relative acceleration
          # peak has two near-equal candidates, and a pose difference of 0.3% of
          # torso length moves the peak 12 frames, the analysis window end from
          # 121 to 107, and the grade from 99 to 65. A gate whose verdict turns
          # on that reports the extractor's coin flip rather than a regression.
          # Both fixtures are demonstrations that are themselves in the expert
          # reference bank, so each must grade at the top of the rubric, draw no
          # coaching cues, and come back paired with a real expert clip. The
          # matched expert is deliberately not pinned to a name: the serve clip
          # lands on a different left-handed expert than the one it came from,
          # which is a legitimate outcome of picking the nearest skeleton.
          #            video skill hand min_grade expert_prefix no_cues expert_video
          run_fixture /tmp/analysis-e2e/smash-expert.mp4 \
            smash right 99 '' 1 1
          run_fixture /tmp/analysis-e2e/serve-expert-left.mov \
            serve left 99 '' 1 1
          # These are deliberately submitted under the opposite requested
          # skill. The pose-derived support gate must reject them rather than
          # grading or silently relabelling them.
          run_wrong_skill_fixture /tmp/analysis-e2e/smash-expert.mp4 serve right
          run_wrong_skill_fixture /tmp/analysis-e2e/serve-expert-left.mov smash left

      - name: Promote verified GPU revision
        # Only the candidate pattern needs promoting. A bootstrapped service is
        # already serving its first revision at 100%, and switching its traffic
        # block from "latest" to a pinned revision makes Cloud Run materialise a
        # second, identical revision -- which then blocks the cleanup below,
        # because the latest-created revision cannot be deleted.
        if: env.ANALYSIS_CANDIDATE_TAG != ''
        run: |
          gcloud run services update-traffic badminton-analysis-ai \
            --region asia-southeast1 \
            --to-revisions "${ANALYSIS_CANDIDATE_REVISION}=100"

      - name: Remove candidate tag
        if: always() && env.ANALYSIS_CANDIDATE_TAG != ''
        run: |
          gcloud run services update-traffic badminton-analysis-ai \
            --region asia-southeast1 \
            --remove-tags "${ANALYSIS_CANDIDATE_TAG}"

      - name: Remove superseded GPU revisions and images
        run: |
          # Cloud Run refuses to delete whichever revision it created last, even
          # with no traffic on it, so that one is left for the next deploy to
          # clear. Tidying is not worth failing a verified deploy over either:
          # a revision that will not delete is reported and stepped over.
          latest_created="$(gcloud run services describe badminton-analysis-ai \
            --region asia-southeast1 \
            --format='value(status.latestCreatedRevisionName)')"
          for revision in $(gcloud run revisions list \
            --service badminton-analysis-ai \
            --region asia-southeast1 \
            --format='value(metadata.name)'); do
            if [[ "${revision}" == "${ANALYSIS_CANDIDATE_REVISION}" ]]; then
              continue
            fi
            if [[ "${revision}" == "${latest_created}" ]]; then
              echo "leaving ${revision}: Cloud Run will not delete its newest revision"
              continue
            fi
            gcloud run revisions delete "${revision}" \
              --region asia-southeast1 --quiet \
              || echo "could not delete ${revision}; leaving it in place"
          done

          active_image="$(gcloud run revisions describe \
            "${ANALYSIS_CANDIDATE_REVISION}" \
            --region asia-southeast1 \
            --format='value(status.imageDigest)')"
          active_digest="${active_image##*@}"
          gcloud container images list-tags \
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/badminton-analysis \
            --limit=100 --format=json | jq -r \
            --arg digest "${active_digest}" \
            '.[] | select(.digest != $digest) | .digest' | \
          while read -r digest; do
            gcloud container images delete \
              "gcr.io/${{ secrets.GCP_PROJECT_ID }}/badminton-analysis@${digest}" \
              --force-delete-tags --quiet \
              || echo "could not delete image ${digest}; leaving it in place"
          done
