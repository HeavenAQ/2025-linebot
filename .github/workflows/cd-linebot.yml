# Deploys the Go LINE bot server (linebot/) to Cloud Run in asia-east1.
# The GPU pose-analysis service it calls is deployed by cd-motion-analysis.yml.
name: LINE Bot Server CD

on:
  push:
    branches:
      - main
    paths:
      - 'linebot/**'
      - '.github/workflows/cd-linebot.yml'
  workflow_dispatch:

jobs:
  deploy:
    defaults:
      run:
        working-directory: ./linebot
    runs-on: ubuntu-latest
    environment: nstc-linebot-2025
    permissions:
      contents: read
      id-token: write # for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authorize Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Who am I?
        run: |
          gcloud auth list
          gcloud config get-value account

      - name: Build and push Docker image
        run: |-
          # `gcloud builds submit` waits by polling the build once a second. Both
          # CD workflows run on a push to main, so two waits share the project's
          # 60-get-requests-per-minute quota; once they exceed it the wait dies on a
          # 429 while the build carries on and succeeds unnoticed, leaving the job
          # hanging until its own timeout. Submit asynchronously and poll slowly, so
          # a rejected poll costs one interval rather than the whole deploy.
          build_id="$(gcloud builds submit --async \
              --timeout=1800s \
              --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_PROJECT_ID }} \
              --format='value(id)')"
          test -n "${build_id}" || { echo "build was not submitted" >&2; exit 1; }
          echo "build ${build_id} submitted"
          reported=""
          for _ in $(seq 1 90); do
            sleep 20
            # A describe that fails is a lost poll, not a failed build: keep waiting.
            status="$(gcloud builds describe "${build_id}" --format='value(status)' 2>/dev/null)" || continue
            if [ "${status}" != "${reported}" ]; then
              echo "  ${status}"
              reported="${status}"
            fi
            case "${status}" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds log "${build_id}" 2>/dev/null | tail -60
                echo "build ${build_id} ended ${status}" >&2
                exit 1 ;;
            esac
          done
          echo "build ${build_id} still running after 30 minutes" >&2
          exit 1

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LIFF_ID: ${{ secrets.NEXT_PUBLIC_LIFF_ID }}
        run: |
          # The GPU analysis service is deployed and torn down on its own
          # schedule, so it may not exist right now. --update-env-vars only
          # touches the keys it is given, so when the service is missing the
          # target is left at whatever the running revision already has rather
          # than being blanked -- and this deploy is not blocked on it.
          env_vars="GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}"
          env_vars="${env_vars},GCP_SERVICE_ACCOUNT_EMAIL=${{ secrets.GCP_SA_EMAIL }}"
          env_vars="${env_vars},ANALYSIS_GRPC_INSECURE=false"
          if analysis_url="$(gcloud run services describe badminton-analysis-ai \
            --region asia-southeast1 --format='value(status.url)' 2>/dev/null)"; then
            env_vars="${env_vars},ANALYSIS_GRPC_TARGET=${analysis_url#https://}"
          else
            echo "badminton-analysis-ai is not deployed; keeping the existing ANALYSIS_GRPC_TARGET"
          fi
          # Learner endpoints authenticate callers by verifying their LINE ID
          # token against the channel that issued it, so the server needs that
          # channel's ID. A LIFF ID is "<login channel id>-<suffix>", which
          # makes the deployed web app and the server it calls impossible to
          # point at different channels by accident.
          login_channel_id="${LIFF_ID%%-*}"
          if ! [[ "${login_channel_id}" =~ ^[0-9]+$ ]]; then
            echo "NEXT_PUBLIC_LIFF_ID does not start with a channel ID" >&2
            exit 1
          fi
          gcloud run deploy ${{ secrets.GCP_PROJECT_ID }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_PROJECT_ID }} \
            --platform managed \
            --region asia-east1 \
            --allow-unauthenticated \
            --service-account ${{ secrets.GCP_SA_EMAIL }} \
            --memory 2Gi \
            --update-env-vars "${env_vars},LINE_LOGIN_CHANNEL_ID=${login_channel_id}" \
            --update-secrets ANALYSIS_GRPC_API_KEY=analysis-grpc-api-key:latest

      - name: Verify deployed backend health
        run: |
          service_url="$(gcloud run services describe ${{ secrets.GCP_PROJECT_ID }} \
            --region asia-east1 --format='value(status.url)')"
          curl --fail --silent --show-error "${service_url}/test"

          # Learner routes refuse a bad token with 401 and refuse everything
          # with 503 when LINE_LOGIN_CHANNEL_ID is missing. Asserting 401 is how
          # this catches a deploy that silently lost the channel ID and would
          # have locked every student out of their own history.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Authorization: Bearer not-a-real-token' \
            "${service_url}/api/db/user")"
          echo "learner route answered ${status} for an invalid token"
          if [ "${status}" != "401" ]; then
            echo "expected 401; 503 means LINE_LOGIN_CHANNEL_ID is not configured" >&2
            exit 1
          fi
