# CI for the GPT-free variant. Production's ci.yml is left untouched on this
# branch so a merge could never replace it; this runs the same three suites
# against the variant's own dependency set, which has no OpenAI SDK in it.
name: CI (no-AI variant)

on:
  pull_request:
    branches: [variant/no-ai]
  push:
    branches: [variant/no-ai]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: linebot/go.mod
          cache-dependency-path: linebot/go.sum
      - working-directory: linebot
        run: go build ./...
      - working-directory: linebot
        run: go vet ./...
      - working-directory: linebot
        run: go test ./...
      - name: Check for code left behind by the GPT removal
        working-directory: linebot
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" -checks 'U1000' ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install checkpoint-test dependencies
        working-directory: badminton_analysis_ai
        run: |
          # torchvision comes with torch, from the same CPU index and at the
          # version pinned in requirements.txt: the pose detector imports it at
          # module scope, so every test that touches the services package needs
          # it present even though none of them run a model.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          # openai is needed to import the service at all: service/coaching.py
          # imports the SDK at module scope and server.py reaches it through
          # pipeline.py. This deployment never calls it -- ANALYSIS_SKIP_COACHING
          # branches before the request -- but the module still has to load.
          pip install google-auth==2.40.3 google-cloud-firestore==2.21.0 google-cloud-storage==3.4.0 grpcio==1.75.1 protobuf==6.32.1 numpy==1.26.4 openai==2.14.0 opencv-python-headless==4.10.0.84 pandas==2.2.3 pillow==10.4.0 pydantic==2.12.5 pytest==8.3.5 scikit-learn==1.7.2 shapely==2.1.2
      - name: Test correction and skill contracts
        working-directory: badminton_analysis_ai
        run: PYTHONPATH=.:generated pytest -q tests
      - name: Import the server the image starts
        working-directory: badminton_analysis_ai
        run: PYTHONPATH=.:generated python -c "import service.server"

  liff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: liff/package-lock.json
      - working-directory: liff
        run: npm ci
      - working-directory: liff
        run: npm test
      - working-directory: liff
        run: npm run build

  no-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # badminton_analysis_ai/ and proto/ are shared with main and do contain the
      # coaching stage; this variant turns it off per deployment rather than by
      # deleting it. So the check covers the code this branch actually owns.
      # linebot/api/analysis/v1 is generated from the shared contract.
      - name: Refuse any reintroduced LLM reference in variant-owned code
        run: |
          if grep -rniE 'openai|gpt' \
            --include='*.go' --include='*.py' --include='*.ts' --include='*.tsx' \
            --exclude-dir=v1 --exclude-dir=node_modules linebot/ liff/; then
            echo "variant-owned code must contain no OpenAI or GPT references" >&2
            exit 1
          fi

      # The flag is the whole of what makes the analysis side GPT-free, so a
      # deploy that lost it must not pass silently.
      - name: Require the deploy to set ANALYSIS_SKIP_COACHING
        run: |
          grep -q 'ANALYSIS_SKIP_COACHING=true' .github/workflows/cd-linebot-noai.yml
          grep -q 'ANALYSIS_SKIP_COACHING=true' .env.example
