name: Badminton Motion Analysis CD

on:
  push:
    branches: [main]
    paths:
      - 'badminton_analysis_ai/**'
      - 'proto/**'
      - 'linebot/api/analysis/**'
      - '.github/workflows/cd-badminton-analysis.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nstc-linebot-2025
    env:
      GCS_BUCKET_NAME: nstc-2025-storage
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: linebot/go.mod
          cache-dependency-path: linebot/go.sum

      - name: Download and verify TensorRT engine cache
        run: |
          mkdir -p badminton_analysis_ai/models/tensorrt-cache
          gcloud storage rsync --recursive \
            gs://${{ env.GCS_BUCKET_NAME }}/models/rtmw3d-ort1.24.4-trt10.14-sm80plus \
            badminton_analysis_ai/models/tensorrt-cache
          cd badminton_analysis_ai
          sha256sum --check models/tensorrt-cache.sha256

      - name: Build GPU analysis image
        working-directory: badminton_analysis_ai
        run: |
          gcloud builds submit \
            --timeout=3600s \
            --machine-type=e2-highcpu-8 \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/badminton-analysis:${{ github.sha }}

      - name: Deploy gRPC analysis service
        run: |
          gcloud run deploy badminton-analysis-ai \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/badminton-analysis:${{ github.sha }} \
            --platform managed \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --use-http2 \
            --service-account ${{ secrets.GCP_SA_EMAIL }} \
            --execution-environment gen2 \
            --gpu-type nvidia-l4 \
            --cpu 4 \
            --memory 16Gi \
            --concurrency 1 \
            --timeout 3600 \
            --max-instances 1 \
            --set-env-vars GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCS_BUCKET_NAME=${{ env.GCS_BUCKET_NAME }},GCP_SERVICE_ACCOUNT_EMAIL=${{ secrets.GCP_SA_EMAIL }},EXPERT_VIDEOS_COLLECTION=badminton_experts_v2,SKELETON_DEVICE=auto,SKELETON_EXECUTION_PROVIDER=tensorrt,POSE_EXECUTION_PROVIDER=tensorrt,POSE_TENSORRT_CACHE_DIR=/app/models/tensorrt-cache,OPENAI_COACHING_MODEL=gpt-5.6-terra,COACHING_PAUSE_SECONDS=2,SIGNED_URL_MINUTES=60 \
            --set-secrets ANALYSIS_GRPC_API_KEY=analysis-grpc-api-key:latest,OPENAI_API_KEY=openai-api-key:latest

      - name: Run real gRPC video analysis
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          mkdir -p /tmp/analysis-e2e
          gcloud storage cp \
            gs://${{ env.GCS_BUCKET_NAME }}/integration-fixtures/clear/EG3.mp4 \
            /tmp/analysis-e2e/EG3.mp4
          service_url="$(gcloud run services describe badminton-analysis-ai \
            --region asia-southeast1 --format='value(status.url)')"
          export ANALYSIS_GRPC_TARGET="${service_url#https://}"
          export ANALYSIS_GRPC_API_KEY="$(gcloud secrets versions access latest \
            --secret analysis-grpc-api-key)"
          export LIVE_ANALYSIS_VIDEO=/tmp/analysis-e2e/EG3.mp4
          export RUN_LIVE_ANALYSIS=1
          cd linebot
          go test -count=1 -v ./api/analysis -run TestLiveAnalysisService
