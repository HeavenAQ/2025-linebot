name: Deploy to Cloud Run

on:
  push:
    branches:
      - moe-114

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: moe-linebot-114
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate required secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ENV_SECRET_ID: ${{ secrets.GCP_ENV_SECRET_ID }}
          GCP_ENV_SECRET_VERSION: ${{ secrets.GCP_ENV_SECRET_VERSION }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          echo "Validating required environment secrets..."

          required_secrets=(
            GCP_PROJECT_ID
            GCP_ENV_SECRET_ID
            GCP_ENV_SECRET_VERSION
            TIMEZONE
            GCP_SA_EMAIL
            GCP_WORKLOAD_IDENTITY_PROVIDER
          )

          for secret in "${required_secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "❌ Missing required secret: $secret"
              exit 1
            else
              echo "✅ $secret is present"
            fi
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authorize Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Who am I?
        run: |
          gcloud auth list
          gcloud config get-value account

      - name: Build Docker image locally
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/moe-linebot-2026 .

      - name: Authenticate Docker to GCR
        run: |
          gcloud auth configure-docker gcr.io

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/moe-linebot-2026

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ENV_SECRET_ID: ${{ secrets.GCP_ENV_SECRET_ID }}
          GCP_ENV_SECRET_VERSION: ${{ secrets.GCP_ENV_SECRET_VERSION }}
          TZ: ${{ secrets.TIMEZONE }}
        run: |
          gcloud run deploy moe-linebot-2026 \
            --image gcr.io/${GCP_PROJECT_ID}/moe-linebot-2026 \
            --platform managed \
            --region asia-east1 \
            --allow-unauthenticated \
            --service-account ${{ secrets.GCP_SA_EMAIL }} \
            --memory 1Gi \
            --set-env-vars "
              GCP_PROJECT_ID=${GCP_PROJECT_ID},
              GCP_ENV_SECRET_ID=${GCP_ENV_SECRET_ID},
              GCP_ENV_SECRET_VERSION=${GCP_ENV_SECRET_VERSION},
              TZ=${TZ}
            "
