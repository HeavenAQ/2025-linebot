syntax = "proto3";

package badminton.analysis.v1;

option go_package = "github.com/HeavenAQ/nstc-linebot-2025/api/analysis/v1;analysisv1";

service BadmintonAnalysis {
  rpc AnalyzeVideo(stream AnalyzeVideoChunk) returns (AnalyzeVideoResponse);
  rpc RefreshPlaybackUrls(RefreshPlaybackUrlsRequest) returns (RefreshPlaybackUrlsResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

enum Skill {
  SKILL_UNSPECIFIED = 0;
  SKILL_SERVE = 1;
  SKILL_LIFT = 2;
  SKILL_CLEAR = 3;
  SKILL_SMASH = 4;
}

enum Handedness {
  HANDEDNESS_UNSPECIFIED = 0;
  HANDEDNESS_AUTO = 1;
  HANDEDNESS_RIGHT = 2;
  HANDEDNESS_LEFT = 3;
}

message AnalyzeVideoHeader {
  string request_id = 1;
  string user_id = 2;
  string filename = 3;
  Skill skill = 4;
  Handedness handedness = 5;
}

message AnalyzeVideoChunk {
  oneof payload {
    AnalyzeVideoHeader header = 1;
    bytes data = 2;
  }
}

message GradingDetail {
  string criterion_id = 1;
  string description = 2;
  double grade = 3;
  double maximum = 4;
}

message GradingOutcome {
  double total_grade = 1;
  repeated GradingDetail grading_details = 2;
  string score_status = 3;
}

message PhaseMarker {
  string id = 1;
  string label = 2;
  int32 normalized_frame = 3;
  double normalized_position = 4;
  double timestamp_seconds = 5;
}

// One point on the map from the learner's motion onto the expert's clock.
//
// The checkpoints in ExpertMatch.timeline are fixed anchors; these fill in the
// movement between them. Playback would otherwise interpolate straight from one
// checkpoint to the next, which assumes the two performers keep the same
// relative tempo inside a phase -- they do not.
message AlignmentSample {
  // Where the learner is in their motion, 0-1.
  double normalized_position = 1;
  // The moment in the expert's video that matches it.
  double expert_seconds = 2;
}

message CoachingCue {
  string title = 1;
  string feedback = 2;
  int32 normalized_frame = 3;
  double normalized_position = 4;
  double student_timestamp_seconds = 5;
  double pause_duration_seconds = 6;
  repeated int32 joint_ids = 7;
}

message StoredVideo {
  string object_path = 1;
  string gcs_uri = 2;
  string signed_url = 3;
  int64 signed_url_expires_at_unix = 4;
  double duration_seconds = 5;
  double fps = 6;
  int32 width = 7;
  int32 height = 8;
}

message ExpertMatch {
  string expert_id = 1;
  string display_name = 2;
  double correction_distance = 3;
  StoredVideo video = 4;
  double motion_start_seconds = 5;
  double motion_end_seconds = 6;
  // The expert's own checkpoints, one per student timeline marker and in the
  // same order, timestamped in the expert video. Playback interpolates between
  // them so each phase stays aligned instead of drifting across the motion.
  repeated PhaseMarker timeline = 7;
  // Dense student-to-expert correspondence from phase-segmental DTW, with the
  // checkpoints above as fixed endpoints. Empty when it could not be computed,
  // and on analyses recorded before it shipped; playback falls back to
  // interpolating between the checkpoints.
  repeated AlignmentSample alignment = 8;
}

message DiagnosticValue {
  string key = 1;
  double value = 2;
}

message AnalyzeVideoResponse {
  string analysis_id = 1;
  Skill skill = 2;
  Handedness handedness = 3;
  GradingOutcome grade = 4;
  StoredVideo student_video = 5;
  ExpertMatch expert = 6;
  repeated PhaseMarker timeline = 7;
  repeated DiagnosticValue diagnostics = 8;
  repeated CoachingCue coaching_cues = 9;
  string overall_feedback = 10;
  // Clean detected/corrected skeletons over the source video, without GPT
  // annotations or inserted coaching pauses.
  StoredVideo skeleton_overlay_video = 11;
  // GPT suggestions, circled joints, and coaching pauses. student_video is a
  // backward-compatible alias of this field.
  StoredVideo feedback_video = 12;
}

message RefreshPlaybackUrlsRequest {
  repeated string object_paths = 1;
}

message RefreshPlaybackUrlsResponse {
  repeated StoredVideo videos = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  repeated Skill loaded_skills = 2;
}
